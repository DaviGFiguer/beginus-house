<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Benignus House</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#17131f; --panel:#262033; --panel2:#352c47; --line:#54466e;
  --text:#f4ecd8; --muted:#b3a7c7; --gold:#ffd23f; --red:#ef476f; --green:#5fd068; --blue:#4cc9f0;
  --font:"Press Start 2P","Courier New",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:var(--text);font-family:var(--font);font-size:10px;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
[hidden]{display:none!important}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* A tela do jogo tem tamanho fixo e é escalada para caber na janela */
#game{position:absolute;left:50%;top:50%;width:1240px;height:600px;transform-origin:center;display:flex;background:#121216;overflow:hidden;user-select:none;-webkit-user-select:none}
#map{position:relative;width:960px;height:600px;flex:none}
#c{display:block;width:960px;height:600px;image-rendering:pixelated;touch-action:none;cursor:crosshair}
.hudtxt{color:#fff;text-shadow:3px 3px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000}

/* HUD por cima do mapa */
#hud{position:absolute;left:10px;top:10px;display:flex;gap:8px;pointer-events:none}
.pill{display:flex;align-items:center;gap:8px;background:rgba(11,11,15,.78);border:3px solid #0b0b0f;padding:5px 12px 5px 5px;font-size:15px}
.ic{width:26px;height:26px;display:flex;align-items:center;justify-content:center;font:bold 15px/1 Arial,sans-serif;color:#0b0b0f;border:2px solid #0b0b0f}
.ic.life{background:#1ed760}
.ic.cash{background:#ffd23f}
#h-wave{position:absolute;right:12px;top:8px;text-align:right;font-size:18px;pointer-events:none;line-height:1.3}
#h-wave small{display:block;font-size:9px;color:var(--gold)}
#h-next{position:absolute;left:50%;top:12px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;background:rgba(11,11,15,.7);border:3px solid #0b0b0f;padding:3px 10px 3px 8px;font-size:8px;pointer-events:none;white-space:nowrap}
#h-next img{width:28px;image-rendering:pixelated}

/* Painel lateral */
#side{width:280px;height:600px;display:flex;flex-direction:column;background:#1a1a22;border-left:4px solid #0b0b0f;flex:none}
#side-head{display:flex;justify-content:space-between;align-items:center;padding:8px 10px 6px;font-size:11px;color:var(--gold)}
#h-diff{font-size:8px;padding:3px 6px;border:2px solid currentColor}
#shop{flex:1;overflow-y:auto;padding:0 8px}
.sec{margin-bottom:6px;padding:5px;border:3px solid var(--c);background:var(--bg)}
.sec h4{margin:0 0 5px;font-size:9px;font-weight:400;color:var(--c);display:flex;justify-content:space-between;align-items:baseline}
.sec h4 small{font-size:6px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tw{min-width:0;background:var(--card);border:3px solid rgba(0,0,0,.4);padding:1px 0 3px;display:flex;flex-direction:column;align-items:center;font-size:8px;color:var(--gold);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.tw img{width:100%;max-width:52px;height:auto;aspect-ratio:64/56;image-rendering:pixelated;pointer-events:none}
.tw:hover{filter:brightness(1.18)}
.tw.sel{border-color:var(--gold)}
.tw.poor img{filter:grayscale(1) brightness(.55)}
.tw.poor span{color:var(--red)}
#upg{flex:1;overflow-y:auto;padding:0 8px 6px}
#tip{margin:0 8px;height:66px;overflow:hidden;background:#0f0f14;border:3px solid #2a2a35;padding:6px 8px;font-size:7px;line-height:1.75;color:var(--muted)}
#tip b{color:var(--gold);font-weight:400}
.tip-inv{display:flex;gap:2px;margin:2px 0}
.tip-inv img{width:24px;height:24px;image-rendering:pixelated}
#controls{display:flex;gap:8px;padding:8px}
.bigbtn{height:58px;border:4px solid #0b0b0f;box-shadow:inset 0 -6px 0 rgba(0,0,0,.28),inset 0 3px 0 rgba(255,255,255,.22);color:#fff;display:flex;align-items:center;justify-content:center;gap:4px}
.bigbtn:hover:not(:disabled){filter:brightness(1.12)}
#b-gear{width:58px;background:#3a3a44;font:bold 26px/1 Arial,sans-serif}
#b-play{flex:1;background:#178a43;font-size:11px}
#b-play.sp2{background:#c9971f}
#b-play.sp3{background:#d9561f}
#b-play.start{animation:pulse 1s infinite}
#b-play:disabled{background:#3a3a44;animation:none;opacity:.7}
@keyframes pulse{50%{filter:brightness(1.3)}}
.tri{display:block;width:0;height:0;border-left:15px solid #fff;border-top:11px solid transparent;border-bottom:11px solid transparent;filter:drop-shadow(2px 2px 0 rgba(0,0,0,.45))}
#b-play .lbl{margin-left:8px;text-shadow:2px 2px 0 rgba(0,0,0,.45)}

/* Botões e painel de upgrades */
.btn{background:var(--panel2);border:3px solid #0b0b0f;padding:7px 10px;white-space:nowrap;box-shadow:inset 0 -3px 0 rgba(0,0,0,.3)}
.btn:hover:not(:disabled){filter:brightness(1.2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:#178a43;color:#fff}
.head{display:flex;gap:8px;margin-bottom:6px;align-items:center}
.head img{width:80px;height:70px;image-rendering:pixelated;flex:none;background:#0f0f14;border:3px solid #2a2a35}
.head .name{color:var(--gold);line-height:1.5;font-size:9px}
.stats{font-size:7px;line-height:1.85}
.note{margin:0 0 8px;font-size:8px;color:var(--muted);line-height:1.8}
.row{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0}
.row .btn{font-size:7px;padding:5px 6px}
.route{background:#0f0f14;border-left:6px solid var(--c,var(--line));padding:7px;margin-top:6px}
.route .top{display:flex;justify-content:space-between;gap:6px;align-items:center;font-size:7px;color:var(--c)}
.pips{display:flex;gap:3px;flex:none}
.pips i{width:9px;height:9px;background:#3b3350;display:block}
.pips i.on{background:var(--c)}
.route p{margin:5px 0;font-size:7px;color:var(--muted);line-height:1.7}
.route .nm{color:var(--text);margin-top:5px;font-size:8px;line-height:1.5}
.route .btn{width:100%;font-size:7px;white-space:normal}
.route.locked{opacity:.55}

/* Telas por cima do jogo (pausa, fim, novo invasor) */
#overlay{position:absolute;inset:0;z-index:15;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;line-height:1.7;background:rgba(11,11,15,.82)}
#overlay h2{margin:0;font-size:34px;line-height:1.25;font-weight:400;color:var(--gold);text-shadow:4px 4px 0 #7a2e5d}
#overlay p{margin:0;max-width:62ch;font-size:10px}
.col{display:flex;flex-direction:column;gap:8px;width:300px}
.col .btn{font-size:10px;padding:10px}
#popup{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:8px;line-height:1.7;background:rgba(11,11,15,.55)}
.card{background:var(--panel);border:4px solid var(--gold);box-shadow:6px 6px 0 #7a2e5d;padding:12px 16px;max-width:420px;width:100%;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.card .tag{color:var(--red);font-size:10px}
.card canvas{width:112px;height:112px;image-rendering:pixelated}
.pname{color:var(--gold);font-size:14px}
.palbum{color:var(--blue);font-size:8px}
.pab{color:var(--green);font-size:9px;margin-top:2px}
.card p{margin:0;font-size:8px;line-height:1.8}
.pstats{font-size:8px;color:var(--muted)}

/* Menu com a cena da Nami */
#scene{position:absolute;left:0;top:0;width:1240px;height:600px;z-index:30;image-rendering:pixelated}
#menu{position:absolute;inset:0;z-index:31;pointer-events:none}
#finger{position:absolute;left:0;top:0;width:1240px;height:600px;z-index:32;pointer-events:none;image-rendering:pixelated}
/* Telas dentro do celular do Benigno */
.phone-ui{position:absolute;left:456px;top:56px;width:328px;height:500px;pointer-events:auto;overflow-y:auto!important;background:linear-gradient(#1d4a32 0,#121212 170px);padding:10px 14px 14px;display:flex;flex-direction:column;gap:8px;overflow:hidden;text-align:left}
.ph-top{display:flex;justify-content:space-between;font-size:7px;color:#cdeed8;margin-bottom:2px}
.ph-back{align-self:flex-start;font-size:8px;color:#fff;padding:4px 0}
.ph-title{margin:0;font-size:15px;line-height:1.3;font-weight:400;color:#fff}
.ph-sub{margin:0 0 4px;font-size:7px;color:#b3b3b3;line-height:1.7}
.ph-map{display:flex;flex-direction:column;gap:8px;background:#232323;padding:8px;text-align:left;border:3px solid transparent}
.ph-map:hover{background:#2e2e2e;border-color:#1ed760}
.ph-map img{width:100%;height:auto;image-rendering:pixelated}
.ph-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ph-name{display:block;font-size:11px;color:#fff;margin-bottom:5px}
.ph-meta{display:block;font-size:6px;line-height:1.7;color:#b3b3b3}
.ph-play{flex:none;width:38px;height:38px;background:#1ed760;border-radius:50%;position:relative}
.ph-play::after{content:"";position:absolute;left:14px;top:11px;border-left:12px solid #0b0b0f;border-top:8px solid transparent;border-bottom:8px solid transparent}
.ph-soon{border:2px dashed #3a3a44;color:#6b6b78;font-size:7px;padding:12px;text-align:center}
.ph-diff{display:flex;flex-direction:column;gap:4px;background:#232323;border-left:6px solid var(--c);padding:7px 10px;text-align:left;flex:none}
.ph-diff:hover{background:#2e2e2e}
.ph-dn{display:flex;justify-content:space-between;font-size:12px;color:var(--c)}
.ph-dn b{font-weight:400;color:var(--gold)}
.ph-list{display:flex;flex-direction:column;gap:6px;overflow-y:auto;flex:1;margin:0 -6px;padding:0 6px}
.ph-pl{display:flex;gap:8px;align-items:center;background:#232323;padding:6px;text-align:left;border:2px solid transparent;flex:none}
.ph-pl:hover{background:#2e2e2e;border-color:#1ed760}
.ph-pl img{width:88px;height:55px;image-rendering:pixelated;flex:none;border:2px solid #0b0b0f}
.ph-pi{display:flex;flex-direction:column;gap:3px;min-width:0}
.ph-pl .ph-name{font-size:8px;margin:0}
.ph-pl .ph-meta{font-size:5px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ph-lv{font-size:6px;color:var(--gold)}
.ph-lv b{font-weight:400}
.ph-cover{width:100%;height:96px;object-fit:cover;flex:none;image-rendering:pixelated;border:2px solid #0b0b0f}
.pc-ui{position:absolute;left:270px;top:50px;width:700px;height:420px;pointer-events:auto;background:linear-gradient(160deg,#3b2363,#141024 70%);display:flex;flex-direction:column;overflow:hidden;text-align:left}
.pc-icons{position:absolute;left:14px;top:14px;display:flex;flex-direction:column;gap:14px}
.pc-ic{display:flex;flex-direction:column;align-items:center;gap:5px;width:84px;font-size:6px;color:#fff;text-align:center;text-shadow:1px 1px 0 #000}
.pc-ic i{width:34px;height:30px;border:3px solid #0b0b0f;display:block}
.pc-win{margin:38px 0 0 170px;width:430px;background:#1a1a22;border:3px solid #0b0b0f;box-shadow:6px 6px 0 rgba(0,0,0,.45)}
.pc-bar{display:flex;justify-content:space-between;align-items:center;background:#5a5a66;padding:5px 6px 5px 10px;font-size:9px;color:#fff}
.pc-bar button{width:22px;height:20px;background:#ef476f;color:#fff;font:bold 12px/1 Arial,sans-serif;border:2px solid #0b0b0f}
.pc-body{padding:16px;display:flex;flex-direction:column;gap:14px}
.pc-row{display:flex;justify-content:space-between;align-items:center;font-size:10px;color:#fff}
.sw{width:60px;height:28px;background:#3a3a44;border:3px solid #0b0b0f;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;background:#fff;box-shadow:2px 2px 0 rgba(0,0,0,.3)}
.sw.on{background:#1ed760}
.sw.on::after{left:35px}
.pc-note{margin:0;font-size:7px;line-height:1.8;color:var(--muted)}
.pc-body .btn{align-self:flex-start;font-size:8px}
.pc-task{margin-top:auto;height:30px;background:#0b0b0f;display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-size:8px;color:#fff}
.pc-start{background:#1ed760;color:#0b0b0f;padding:3px 8px}
.panel{position:absolute;pointer-events:auto;background:rgba(14,12,22,.86);border:4px solid #0b0b0f;box-shadow:8px 8px 0 rgba(0,0,0,.45);padding:20px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.logo{margin:0;font-size:40px;line-height:1.15;font-weight:400;color:var(--gold);text-shadow:4px 4px 0 #7a2e5d,8px 8px 0 #0b0b0f}
.sub{margin:0;font-size:9px;line-height:1.9;color:var(--text)}
.mbtn{width:100%;font-size:14px;padding:0 16px}
.mbtn.go{background:#178a43;height:72px;font-size:18px;animation:pulse 1.4s infinite}
.mbtn.alt{background:#3a3a44;height:52px}
.ptitle{margin:0;font-size:16px;color:var(--gold);font-weight:400}
.mapcard{display:flex;flex-direction:column;gap:8px;align-items:center;background:#1d5c37;border:4px solid #1ed760;padding:10px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.3)}
.mapcard:hover{filter:brightness(1.15)}
.mapcard img{width:300px;height:188px;image-rendering:pixelated;border:3px solid #0b0b0f}
.mapcard b{font-size:12px;font-weight:400;color:#fff}
.mapcard span{font-size:7px;color:#cdeed8}
.diffs{display:flex;gap:10px;justify-content:center}
.diff{background:var(--panel);border:4px solid var(--c);padding:10px 12px;width:168px;display:flex;flex-direction:column;gap:6px;align-items:center;font-size:7px;line-height:1.8;box-shadow:inset 0 -5px 0 rgba(0,0,0,.3)}
.diff:hover{background:var(--panel2);transform:translateY(-2px)}
.diff b{font-weight:400;font-size:13px;color:var(--c)}
.diff .medal{color:var(--gold)}
.diff .medal.off{color:#6b6280}
.medals{font-size:8px;color:var(--muted)}

#rotate{display:none;position:fixed;inset:0;z-index:99;background:#0b0b0f;color:#fff;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:12px;line-height:2}
@media (orientation:portrait) and (max-width:900px){ #rotate{display:flex} }
::-webkit-scrollbar{width:8px} ::-webkit-scrollbar-thumb{background:#3a3a44} ::-webkit-scrollbar-track{background:transparent}
.twwrap{position:relative;min-width:0}
.twwrap .tw{width:100%}
.tw-i{position:absolute;top:3px;right:3px;width:15px;height:15px;background:#0b0b0f;color:#fff;font:bold 10px/15px Georgia,serif;border-radius:50%;text-align:center;opacity:.85}
.tw-i:hover{background:var(--gold);color:#0b0b0f}
.bon{background:#0f0f14;border:3px solid #2a2a35;padding:6px 7px;margin:4px 0 2px}
.bon-h{font-size:7px;color:var(--gold);margin-bottom:4px}
.bon-r{display:flex;gap:6px;align-items:center;font-size:6px;line-height:1.6;color:var(--muted);margin-top:3px}
.bon-r img{width:26px;height:23px;image-rendering:pixelated;flex:none;background:#1a1a22}
.bon-r b{display:block;color:var(--text);font-weight:400}
.bon-r.none{color:#6b6b78}
.poster-hit{position:absolute;pointer-events:auto;background:transparent;border:0}
.poster-hit:focus-visible{outline:3px solid var(--gold)}
.medal-info{left:800px;top:34px;width:400px;align-items:stretch;text-align:left}
.medal-info .sub{text-align:left}
.mdl{display:flex;gap:10px;align-items:center;background:#1a1a22;border:3px solid #0b0b0f;padding:8px;font-size:7px;line-height:1.7;color:var(--muted)}
.mdl i{width:22px;height:22px;border-radius:50%;border:3px solid #0b0b0f;flex:none}
.mdl b{display:block;color:var(--text);font-weight:400;font-size:8px}
.mdl.off{opacity:.6}
.ti{display:flex;gap:18px;width:1140px;height:540px;text-align:left}
.ti-l{width:300px;display:flex;flex-direction:column;gap:10px}
.ti-card{background:linear-gradient(var(--c),#1a1a22 75%);border:5px solid #0b0b0f;box-shadow:inset 0 0 0 3px rgba(255,255,255,.2);display:flex;flex-direction:column;align-items:center;padding:10px;gap:6px}
.ti-card b{font-size:11px;color:#fff;font-weight:400;text-shadow:2px 2px 0 #000;text-align:center}
.ti-card canvas{width:256px;height:224px;image-rendering:pixelated}
.ti-card span{font-size:8px;color:var(--gold)}
.ti-txt{flex:1;background:#14121c;border:3px solid #0b0b0f;padding:10px;font-size:8px;line-height:1.8;overflow:auto}
.ti-txt h3{margin:4px 0;font-size:10px;font-weight:400;color:#fff}
.ti-txt p{margin:4px 0 8px;font-size:8px;max-width:none;color:var(--muted)}
.ti-lv{font-weight:400;color:var(--gold)}
.ti-r{flex:1;background:var(--bg);border:5px solid #0b0b0f;padding:12px;display:flex;flex-direction:column;gap:8px}
.ti-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ti-top h2{margin:0;font-size:16px;font-weight:400;color:var(--gold);text-shadow:2px 2px 0 #000}
.ti-top p{margin:4px 0 0;font-size:8px;max-width:none}
.ti-base{align-self:flex-start;font-size:8px;padding:6px 10px;background:#1a1a22;border:3px solid #0b0b0f}
.ti-base.on{border-color:var(--gold);color:var(--gold)}
.ti-row{display:flex;flex-direction:column;gap:4px}
.ti-rn{font-size:9px;color:var(--rc)}
.ti-nodes{display:flex;gap:10px;position:relative}
.ti-nodes::before{content:"";position:absolute;left:30px;right:30px;top:38px;height:4px;background:#0b0b0f}
.ti-node{position:relative;width:146px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:6px;line-height:1.4;color:#fff;text-align:center}
.ti-node img{width:78px;height:68px;image-rendering:pixelated;background:radial-gradient(circle,#3b5f8a,#1d3350 70%);border:4px solid #0b0b0f;border-radius:50%;padding:4px}
.ti-node.top img{background:radial-gradient(circle,#ffd23f,#c97b10 70%)}
.ti-node.on img{border-color:var(--rc);box-shadow:0 0 0 4px #fff}
.ti-node.own img{border-color:#5fd068}
.ti-node.own::after{content:"✓";position:absolute;top:0;right:30px;background:#5fd068;color:#0b0b0f;font:bold 11px/18px Arial;width:18px;height:18px;border-radius:50%}
.ti-node:hover img{filter:brightness(1.15)}
#record{position:absolute;left:50%;top:84px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:rgba(11,11,15,.85);border:4px solid var(--gold);box-shadow:6px 6px 0 #7a2e5d;padding:6px 18px 6px 6px;pointer-events:none;animation:recIn .4s ease-out}
#record canvas,.rec-end canvas{width:108px;height:120px;image-rendering:pixelated}
#record b,.rec-end b{display:block;font-size:16px;font-weight:400;color:var(--gold);text-shadow:3px 3px 0 #7a2e5d}
#record span,.rec-end span{font-size:9px;color:#fff}
@keyframes recIn{from{transform:translate(-50%,-30px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.rec-end{display:flex;align-items:center;gap:12px;background:#1a1a22;border:4px solid var(--gold);padding:6px 18px 6px 6px;text-align:left}
.ph-rec{font-size:6px;color:#c77dff}
.player{position:absolute;right:48px;bottom:22px;width:440px;pointer-events:auto;display:flex;align-items:center;gap:12px;background:rgba(14,12,22,.9);border:4px solid #0b0b0f;box-shadow:6px 6px 0 rgba(0,0,0,.45);padding:8px 10px 8px 8px}
.pl-cover{width:52px;height:52px;flex:none;border:3px solid #0b0b0f;display:flex;align-items:center;justify-content:center}
.pl-cover b{width:18px;height:18px;background:#0b0b0f;border-radius:50%;animation:spin 2s linear infinite;border:5px solid rgba(255,255,255,.25)}
@keyframes spin{to{transform:rotate(360deg)}}
.pl-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;text-align:left}
.pl-txt b{font-weight:400;font-size:10px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-txt span{font-size:7px;color:var(--muted)}
.pl-now{color:#1ed760!important;font-size:6px!important}
.pl-bar{display:block;height:3px;background:#3a3a44;position:relative;overflow:hidden}
.pl-bar i{position:absolute;left:0;top:0;bottom:0;width:30%;background:#1ed760;animation:plbar 8s linear infinite}
@keyframes plbar{from{width:0}to{width:100%}}
.pl-btn{width:38px;height:38px;flex:none;background:#2a2a35;border:3px solid #0b0b0f;display:flex;align-items:center;justify-content:center}
.pl-btn:hover{background:#1db954}
.pl-prev,.pl-next{display:block;width:0;height:0;border-top:7px solid transparent;border-bottom:7px solid transparent;position:relative}
.pl-next{border-left:10px solid #fff;margin-right:-4px}
.pl-prev{border-right:10px solid #fff;margin-left:-4px}
.pl-next::after,.pl-prev::after{content:"";position:absolute;top:-7px;width:3px;height:14px;background:#fff}
.pl-next::after{left:0}
.pl-prev::after{right:0}
</style>
</head>

<div id="game">
  <div id="map">
    <canvas id="c" width="960" height="600" aria-label="Campo de batalha"></canvas>
    <div id="hud">
      <div class="pill hudtxt" title="Músicas suas na playlist"><i class="ic life">♪</i><b id="h-life">0</b></div>
      <div class="pill hudtxt" title="Dinheiro"><i class="ic cash">$</i><b id="h-money">0</b></div>
    </div>
    <div id="h-wave" class="hudtxt"></div>
    <div id="h-next" class="hudtxt" hidden></div>
    <div id="record" hidden><canvas width="216" height="240"></canvas><div><b>RECORDE ATINGIDO!</b><span class="rc-wave"></span></div></div>
  </div>
  <aside id="side">
    <div id="side-head"><span>TORRES</span><span id="h-diff"></span></div>
    <div id="shop"></div>
    <div id="upg" hidden></div>
    <div id="tip"></div>
    <div id="controls">

      <button class="bigbtn" id="b-play" aria-label="Soltar onda ou acelerar"></button>
    </div>
  </aside>
  <div id="overlay" hidden></div>
  <div id="popup" hidden role="dialog" aria-label="Novo invasor"><div class="card">
    <div class="tag">NOVO INVASOR!</div>
    <canvas id="pop-cv" width="56" height="56"></canvas>
    <div class="pname" id="pop-name"></div>
    <div class="palbum" id="pop-album"></div>
    <div class="pab" id="pop-ab"></div>
    <p id="pop-text"></p>
    <div class="pstats" id="pop-stats"></div>
    <button class="btn primary" id="pop-ok">Entendi</button>
  </div></div>
  <canvas id="scene" width="1240" height="600"></canvas>
  <div id="menu"></div>
  <canvas id="finger" width="1240" height="600"></canvas>
</div>

// ---------- Ondas ----------
function buildWave(n){
  const b = ['paul63','george64','ringo65','john65','ringo68','george67','john68','paul69','john70'];
  const g = ['steven87','izzy88','duff87','axl87','slash87','axl91','slash91','duff93','axl08'];
  const beatles = b.slice(0, Math.min(9, Math.ceil(n/2))), guns = g.slice(0, Math.min(9, Math.floor(n/2)));
  const pool = n >= 13 ? [...beatles,...guns] : (n % 2 ? beatles : guns);
  const count = Math.min(70, 4 + Math.floor(n*1.5)), gap = Math.max(.4, 1.25 - n*.045), hpMul = 1 + .1*(n-1) + .03*(n-1)*(n-1);
  const list = [];
  // o tipo mais novo sempre aparece logo no começo da onda
  const newest = n % 2 ? beatles.at(-1) : guns.at(-1);
  for(let i=0;i<count;i++) list.push({type:i===1?newest:pool[i*7 % pool.length], gap, hpMul});
  const boss = (type,mult)=>list.push({type, gap:2, hpMul:hpMul*mult, boss:true});
  if(n===5) boss('ringo68',3.5);
  if(n===10) boss('slash87',6);
  if(n===15){ boss('john70',4); boss('axl91',6); }
  if(n===20){ boss('john70',4); boss('slash91',4); boss('axl08',2.5); }
  if(n===25){ boss('ringo68',5); boss('john70',4); boss('slash91',4); boss('axl08',2.5); }
  if(n>25&&n%5===0){ const pool=['ringo68','slash87','john70','axl91','slash91','axl08'], k=(n/5)%pool.length; boss(pool[k],4); boss(pool[(k+2)%pool.length],3); if(n%10===0) boss(pool[(k+4)%pool.length],2.5); }
  return list;
}

function drawFlow(){

  for(let d=off;d<pathLen;d+=sp){
    const p=posAt(d), a=posAt(Math.max(0,d-2)), b=posAt(Math.min(pathLen,d+2));

    ctx.fillStyle=start?'#3cff7a':end?'#ff3b4f':(MAP_SKIN[MAP.key].flow||'#ffffff');
    ctx.save(); ctx.translate(Math.round(p.x),Math.round(p.y)); ctx.rotate(Math.atan2(b.y-a.y,b.x-a.x));

  }

}

function n2f(x){ const m=/^([A-G])(#?)(\d)$/.exec(x); const s={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]]+(m[2]?1:0); return 440*Math.pow(2,(12*(+m[3]+1)+s-69)/12); }

  const tk=str.trim().split(/\s+/).filter(Boolean), at=new Map();
  tk.forEach((x,i)=>{ if(x==='-'||x==='.') return; let len=1; while(tk[i+len]==='-') len++; at.set(i,drum?x:{f:n2f(x),len}); });

function pulseWave(d){
  if(music.pulse[d]) return music.pulse[d];
  const n=32, re=new Float32Array(n), im=new Float32Array(n);
  for(let k=1;k<n;k++) im[k]=2/(k*Math.PI)*Math.sin(k*Math.PI*d);

}
function chipNote(type,f,t,dur,vol,vib){
  const o=ac.createOscillator(), g=ac.createGain();

  o.frequency.setValueAtTime(f,t);
  if(vib&&dur>.3){ const l=ac.createOscillator(), lg=ac.createGain(); l.frequency.value=5.5; lg.gain.setValueAtTime(0,t); lg.gain.linearRampToValueAtTime(f*.012,t+.3); l.connect(lg).connect(o.frequency); l.start(t); l.stop(t+dur+.2); }

function chipDrum(k,t){

  fl.type=k==='s'?'bandpass':'highpass'; fl.frequency.value=k==='s'?1800:7000;

  src.connect(fl).connect(g).connect(music.out); src.start(t); src.stop(t+d+.02);
}
function musicTick(){
  if(!music.cur||!ac) return;

  while(music.next<ac.currentTime+.15){
    const t=music.next, s=music.step;
    for(const c of music.chans){
      const ev=c.tr.at.get(s%c.tr.n); if(!ev) continue;
      if(c.drum) chipDrum(ev,t); else chipNote(c.type,ev.f,t,ev.len*sd*.92,c.vol,c.vib);
    }

}

let hudCache='';
function refreshHud(){
  $('h-money').textContent=Math.floor(S.money);
  $('h-life').textContent=S.life;
  const can=S.mode==='idle'&&(S.free||S.wave<MAX_WAVES);
  const state=S.mode==='over'?'over':can?'start'+S.wave:'sp'+ui.speed;
  if(state!==hudCache){
    hudCache=state;
    $('h-wave').innerHTML=S.free?'<small>JOGO LIVRE · RECORDE '+freeRecord()+'</small>'+S.wave:'<small>ONDA</small>'+Math.min(S.wave,MAX_WAVES)+'/'+MAX_WAVES;
    const b=$('b-play'); b.disabled=S.mode==='over'; b.className='bigbtn';
    if(can){ b.classList.add('start'); b.innerHTML='<i class="tri"></i><span class="lbl">ONDA '+(S.wave+1)+'</span>'; }
    else if(S.mode==='wave'){ b.classList.add('sp'+ui.speed); b.innerHTML='<i class="tri"></i>'.repeat(ui.speed)+'<span class="lbl">x'+ui.speed+'</span>'; }
    else b.innerHTML='<span class="lbl">FIM</span>';
  }
  twEls().forEach(el=>el.classList.toggle('poor',S.money<price(defOf(el))));
  document.querySelectorAll('[data-cost]').forEach(el=>{ el.disabled=S.money<+el.dataset.cost; });
  const ba=$('bank-amt'); if(ba&&ui.selected&&ui.selected.s.bank) ba.textContent='$'+Math.floor(ui.selected.bank)+' / $'+ui.selected.s.bankCap;
}
function buildShop(){
  $('shop').innerHTML='';
  for(const cat of CATS){
    const sec=document.createElement('section'); sec.className='sec';
    sec.style.cssText=`--c:${cat.c};--bg:${cat.bg};--card:${cat.card}`;
    sec.innerHTML=`<h4>${cat.name.toUpperCase()}<small>${cat.hint}</small></h4><div class="grid"></div>`;
    for(const d of TOWERS.filter(d=>CAT_OF[d.id]===cat.key)){
      const w=document.createElement('div'); w.className='twwrap';
      const b=document.createElement('button'); b.className='tw'; b.dataset.id=d.id;
      b.innerHTML=`<img alt="" src="${iconOf(d.id)}"><span>$${price(d)}</span>`;
      b.setAttribute('aria-label',d.name+', custa '+price(d));
      b.onclick=()=>{ if(S.money<price(d)&&ui.placing!==d) return; ui.placing=ui.placing===d?null:d; ui.selected=null; refreshShop(); refreshInfo(); };
      b.ondblclick=()=>{ ui.placing=null; refreshShop(); refreshInfo(); openTowerInfo(d); };
      b.onmouseenter=()=>{ ui.tipDef=d; refreshTip(); };
      b.onmouseleave=()=>{ ui.tipDef=null; refreshTip(); };
      const i=document.createElement('button'); i.className='tw-i'; i.textContent='i'; i.title='Ver rotas de '+d.name; i.setAttribute('aria-label','Ver rotas de '+d.name);
      i.onclick=ev=>{ ev.stopPropagation(); openTowerInfo(d); };
      w.append(b,i); sec.lastElementChild.append(w);
    }
    $('shop').append(sec);
  }
}
function refreshShop(){
  twEls().forEach(el=>el.classList.toggle('sel',ui.placing===defOf(el)));
  $('shop').hidden=!!ui.selected; $('upg').hidden=!ui.selected; $('tip').hidden=!!ui.selected;
}
function statsLine(s,t){
  const lines=[];
  if(s.kind==='beam') lines.push('Dano: '+Math.round(s.dmg)+'/s · Feixes: '+s.beams);
  else if(s.dmg) lines.push('Dano: '+Math.round(s.dmg)+' · Tiros/s: '+(+s.rate.toFixed(2)));
  if(s.range) lines.push('Alcance: '+(+s.range.toFixed(1)));
  if(s.income) lines.push('Renda: $'+s.income+' por onda');
  if(s.buff) lines.push('Bônus de dano: +'+Math.round(s.buff*100)+'%');
  if(s.rateBuff) lines.push('Bônus de velocidade: +'+Math.round(s.rateBuff*100)+'%');
  if(s.auraSlow) lines.push('Lentidão na área: '+Math.round((1-s.auraSlow)*100)+'%');
  if(s.lifeWave) lines.push('Devolve '+s.lifeWave+' música(s) por onda');
  if(s.farmAmt) lines.push('Gera $'+s.farmAmt+' a cada '+(+s.farmEvery.toFixed(1))+'s');
  if(s.towerTax) lines.push('Imposto: $'+s.towerTax+' por torre a cada onda');
  if(s.globalGold) lines.push('Inimigos valem +$'+s.globalGold+' no mapa todo');
  if(s.incomeBoost) lines.push('Rendas e moedas: +'+Math.round(s.incomeBoost*100)+'%');
  if(s.bank) lines.push('Cofre de até $'+s.bankCap+(s.interest?' · juros de '+Math.round(s.interest*100)+'%':''));
  if(s.ult) lines.push('Especial: a cada '+s.ult.every+'s');
  if(t&&t.mult>1) lines.push('Recebendo +'+Math.round((t.mult-1)*100)+'% de dano');
  return lines.join('<br>');
}

    const cat=CATS.find(c=>c.key===CAT_OF[d.id]);
    box.innerHTML=`<b>${d.name}</b> · <span style="color:${cat.c}">${cat.name}</span> · $${price(d)}<br>${d.desc}`+(ui.placing?'<br><span style="color:#fff">Clique no mapa para colocar. Esc cancela.</span>':'');
  } else box.innerHTML=(ui.nextHtml||'<b>Defenda a playlist!</b>')+'<span>Espaço: soltar onda / acelerar · ⓘ: rotas da torre</span>';

  const t=ui.selected;

  { const hs=t.helps||[], helping=S.towers.filter(o=>o!==t&&(o.helps||[]).some(x=>x.a===t)).length;
    html+=`<div class="bon"><div class="bon-h">Bônus recebidos</div>${hs.length?hs.map(x=>`<div class="bon-r"><img alt="" src="${iconOf(x.a.def.id,x.a.up)}"><span><b>${x.a.def.name}</b>${x.txt}</span></div>`).join(''):'<div class="bon-r none">Nenhuma torre está ajudando esta.</div>'}${helping?`<div class="bon-h" style="margin-top:6px">Ajudando ${helping} torre${helping>1?'s':''}</div>`:''}</div>`; }
  if(t.s.bank) html+=`<div class="route" style="--c:#ffd23f"><div class="top"><span>Cofre de Aura</span><span id="bank-amt">$${Math.floor(t.bank)} / $${t.s.bankCap}</span></div><button class="btn primary" id="b-withdraw">Sacar o dinheiro</button></div>`;

    else if(st==='capped') body=`<p>Limitada ao nível 2: outra rota passou do nível 2.</p>`;
    else { const u=ups[lvl], c=upCost(t.def,lvl); body=`<div class="nm">${u[0]}</div><p>${u[1]}</p><button class="btn${lvl===3?' primary':''}" data-route="${p}" data-cost="${c}">Comprar $${c}</button>`; }
    html+=`<div class="route ${st==='ok'?'':'locked'}" style="--c:${color}"><div class="top"><span>${name}</span><span class="pips">${pips}</span></div>${body}</div>`;
  });
  box.innerHTML=html;
  $('b-sell').onclick=()=>sell(t);
  $('b-close').onclick=()=>{ ui.selected=null; refreshInfo(); };
  $('b-routes').onclick=()=>openTowerInfo(t.def,t);
  $('b-aim').onclick=()=>{ t.aim=(t.aim+1)%AIM.length; refreshInfo(); };
  if($('b-withdraw')) $('b-withdraw').onclick=()=>{ const v=Math.floor(t.bank); if(v<=0) return; S.money+=v; t.bank-=v; showCollected(t,v); burst(t.x,t.y-40,'#ffd23f',16,180,2,160,'coin'); blip(1200,.2,'triangle',.06); refreshInfo(); };
  box.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>{ if(buyUpgrade(t,+b.dataset.route)) refreshInfo(); });
}

function endGame(win){

    recHtml=isNew?'<div class="rec-end"><canvas id="rec-cv" width="216" height="240"></canvas><div><b>RECORDE ATINGIDO!</b><span>Onda '+done+' no jogo livre</span></div></div>':'<p>Recorde no jogo livre: onda '+Math.max(best,done)+'</p>';
  }

    ? `<h2>A playlist está salva!</h2><p>Benigno segue ouvindo as músicas dele em paz: ${S.life} de ${START_LIFE} faixas continuam dele. Medalha do modo ${DIFF.name} conquistada!</p><p>No jogo livre você continua neste mapa com as mesmas torres, e as ondas não acabam mais.</p><div class="row"><button class="btn primary" id="b-free">Jogo livre</button><button class="btn" id="b-again">Jogar de novo</button><button class="btn" id="b-menu">Menu inicial</button></div>`

      : `<h2>Invadiram a playlist!</h2><p>Agora só toca Beatles e Guns N' Roses no Spotify do Benigno. Você resistiu até a onda ${S.wave} e derrubou ${S.kills} invasores no modo ${DIFF.name}.</p><div class="row"><button class="btn primary" id="b-again">Tentar de novo</button><button class="btn" id="b-menu">Menu inicial</button></div>`);

function tileFromEvent(ev){
  const b=canvas.getBoundingClientRect();
  return {c:Math.floor((ev.clientX-b.left)/b.width*COLS), r:Math.floor((ev.clientY-b.top)/b.height*ROWS)};
}
canvas.addEventListener('pointermove',ev=>{ ui.hover=tileFromEvent(ev); collectAt(ev); });
canvas.addEventListener('pointerleave',()=>{ ui.hover=null; });
canvas.addEventListener('dblclick',ev=>{ const {c,r}=tileFromEvent(ev), t=S.towers.find(o=>o.c===c&&o.r===r); if(t) openTowerInfo(t.def,t); });
canvas.addEventListener('pointerdown',ev=>{
  initAudio();
  collectAt(ev);
  const {c,r}=tileFromEvent(ev);
  if(ui.placing){
    const t=place(ui.placing,c,r);
    if(t){ ui.placing=null; refreshInfo(); }
    else ui.hover={c,r};
    return;
  }
  ui.selected=S.towers.find(t=>t.c===c&&t.r===r)||null;
  refreshInfo();
});
$('b-play').onclick=playAction;
$('b-gear').onclick=openPause;
addEventListener('pointerdown',()=>initAudio());
addEventListener('keydown',ev=>{
  initAudio();
  if(ui.menu) return;
  if((ev.code==='Enter'||ev.code==='Space')&&!$('popup').hidden){ ev.preventDefault(); closePopup(); return; }
  if(ev.code==='Escape'&&ui.ti){ closeTowerInfo(); return; }
  if(ev.code==='Escape'){
    if(!$('overlay').hidden&&ui.paused) closePause();
    else if(ui.placing||ui.selected){ ui.placing=null; ui.selected=null; refreshInfo(); }
    else openPause();
  }
  if(ev.code==='Space'&&ev.target.tagName!=='BUTTON'&&$('overlay').hidden){ ev.preventDefault(); playAction(); }
});

// ---------- Laço principal ----------
let last=0;
function loop(now){
  const dt=Math.min(.05,(now-last)/1000||0); last=now;
  if(ui.menu){ drawScene(dt); updateBossMusic(); requestAnimationFrame(loop); return; }
  if(ui.ti) drawTowerInfoSprite(now);
  if(!$('record').hidden){ drawSixSeven($('record').querySelector('canvas'),now); recordT-=dt; if(recordT<=0) $('record').hidden=true; }
  if($('rec-cv')) drawSixSeven($('rec-cv'),now);
  if(popupDef){ const g=$('pop-cv').getContext('2d'); g.imageSmoothingEnabled=false; g.clearRect(0,0,56,56); g.drawImage(popupDef.frames[Math.floor(now/140)%4],0,0); }
  if(!ui.paused&&$('overlay').hidden&&$('popup').hidden&&S.mode!=='over'){
    for(let i=0;i<ui.speed&&S.mode!=='over';i++) step(dt);
  }
  updateBossMusic(); render(); refreshHud();
  requestAnimationFrame(loop);
}
Promise.resolve(document.fonts?.load?.('10px "Press Start 2P"')).catch(()=>{})
  .then(()=>{ newGame('medium'); try{ if(localStorage.getItem('bh-auto')==='1') setAuto(true); if(localStorage.getItem('bh-music')==='0') ui.music=false; if(localStorage.getItem('bh-sfx')==='0') ui.sfx=false; }catch(e){} openMenu('home'); requestAnimationFrame(loop); });
